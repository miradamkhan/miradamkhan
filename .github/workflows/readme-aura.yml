name: Generate README

on:
  push:
    branches: [main]
    paths: ['readme.source.md', '.github/assets/avatar.png', '.github/assets/linkedin.png']
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes readme-aura@latest build -g miradamkhan

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md .github/assets
          git diff --staged --quiet || git commit -m "chore: regenerate README"
          git push
